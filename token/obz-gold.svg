<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">OBZ Gold Bitcoin Coin</title>
  <desc id="desc">A round polished gold OBZ token with a Bitcoin symbol and engraved geometric patterns.</desc>
  <defs>
    <radialGradient id="face" cx="36%" cy="28%" r="76%">
      <stop offset="0" stop-color="#fff4a3"/>
      <stop offset="0.28" stop-color="#f8d45b"/>
      <stop offset="0.65" stop-color="#d99a16"/>
      <stop offset="1" stop-color="#8f5506"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7b5"/>
      <stop offset="0.2" stop-color="#e7b52f"/>
      <stop offset="0.5" stop-color="#fff080"/>
      <stop offset="0.72" stop-color="#b66d08"/>
      <stop offset="1" stop-color="#6e3b03"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fff8c7"/>
      <stop offset="0.38" stop-color="#f2c64c"/>
      <stop offset="1" stop-color="#9b5b05"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#2a1600" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Realistic raised rim with fine reeded edge -->
    <circle cx="256" cy="256" r="226" fill="#4e2a00" stroke="#2e1800" stroke-width="8"/>
    <circle cx="256" cy="256" r="218" fill="url(#rim)" stroke="#fff0a0" stroke-width="4"/>
    <circle cx="256" cy="256" r="207" fill="none" stroke="#8a5005" stroke-width="9" stroke-dasharray="2 7"/>
    <circle cx="256" cy="256" r="196" fill="url(#face)" stroke="#ffe889" stroke-width="5"/>
    <circle cx="256" cy="256" r="181" fill="none" stroke="#9b5d08" stroke-width="7"/>
    <circle cx="256" cy="256" r="175" fill="none" stroke="#fff1a1" stroke-width="2" opacity="0.8"/>

    <!-- Full-face blockchain circuit engraving -->
    <g fill="none" stroke="#fff0a0" stroke-width="3" opacity="0.62" stroke-linecap="round" stroke-linejoin="round">
      <path d="M82 198h34l20-20h42l21 21h34l22-22h42l20 21h38"/>
      <path d="M79 314h38l20 20h42l21-21h34l22 22h42l20-21h38"/>
      <path d="M198 82v34l-20 20v42l21 21v34l-22 22v42l21 20v38"/>
      <path d="M314 79v38l-20 20v42l21 20v34l-22 22v42l21 20v38"/>
      <path d="M112 112l38 38M362 112l-38 38M112 400l38-38M400 400l-38-38"/>
      <path d="M98 256h54M360 256h54M256 98v54M256 360v54" opacity="0.85"/>
    </g>
    <g fill="#fff3a1" stroke="#9b5d08" stroke-width="2">
      <circle cx="116" cy="198" r="6"/><circle cx="198" cy="116" r="6"/>
      <circle cx="396" cy="198" r="6"/><circle cx="314" cy="116" r="6"/>
      <circle cx="116" cy="314" r="6"/><circle cx="198" cy="396" r="6"/>
      <circle cx="396" cy="314" r="6"/><circle cx="314" cy="396" r="6"/>
      <circle cx="152" cy="256" r="5"/><circle cx="360" cy="256" r="5"/>
      <circle cx="256" cy="152" r="5"/><circle cx="256" cy="360" r="5"/>
    </g>

    <!-- Central Bitcoin mark -->
    <text x="256" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="176" font-weight="900" fill="#633900" opacity="0.5">₿</text>
    <text x="256" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="176" font-weight="900" fill="url(#letter)" stroke="#fff0a0" stroke-width="3">₿</text>
    <path d="M174 350h164" stroke="#ffe889" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <text x="256" y="382" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" letter-spacing="8" fill="#fff0a0">OBZ</text>
  </g>
</svg>
