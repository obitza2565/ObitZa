<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<title>OBZ Token Logo Preview</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#ffffff;font-family:sans-serif;gap:24px;}
  .row{display:flex;align-items:center;gap:32px;}
  img{background:#fff;}
  .lbl{font-size:12px;color:#888;text-align:center;}
</style>
</head>
<body>
  <div class="row">
    <div><img src="obz-token.svg" width="256" height="256" alt="OBZ token 256px"/><div class="lbl">256px</div></div>
    <div><img src="obz-token.svg" width="128" height="128" alt="OBZ token 128px"/><div class="lbl">128px</div></div>
    <div><img src="obz-token.svg" width="64" height="64" alt="OBZ token 64px"/><div class="lbl">64px</div></div>
    <div><img src="obz-token.svg" width="32" height="32" alt="OBZ token 32px"/><div class="lbl">32px</div></div>
  </div>
</body>
</html>
